name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm --onefile --console --name gsi-earth-overlay app.py

      - name: Smoke-test executable
        run: .\dist\gsi-earth-overlay.exe --help

      - name: Package release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\gsi-earth-overlay.exe, README.md, LICENSE -Destination release
          Compress-Archive -Path release\* -DestinationPath gsi-earth-overlay-windows-x64.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: gsi-earth-overlay-windows-x64.zip
          generate_release_notes: true
